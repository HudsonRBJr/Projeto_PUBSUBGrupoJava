<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${produto.nome})}"></head>
<body>
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>

<main class="container">
    <div th:replace="~{fragmentos/layout :: mensagens}"></div>

    <a th:href="@{/produtos}" class="voltar">&larr; Voltar ao catálogo</a>

    <section class="detalhe">
        <div class="vitrine">
            <img id="imagem-destaque"
                 th:if="${produto.imagemPrincipal != null}"
                 th:src="${produto.imagemPrincipal.urlPublica}"
                 th:alt="${produto.nome}">
            <div th:unless="${produto.imagemPrincipal != null}" class="sem-imagem grande">Sem imagem</div>
        </div>

        <div class="info">
            <h1 th:text="${produto.nome}">Produto</h1>
            <p class="preco grande" th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
            <p class="descricao-completa" th:text="${produto.descricao}">Descrição</p>
            <p class="meta" th:text="'Cadastrado em ' + ${#temporals.format(produto.dataCadastro, 'dd/MM/yyyy HH:mm')}"></p>

            <div class="acoes">
                <a th:href="@{/produtos/{id}/editar(id=${produto.id})}" class="botao secundario">Editar dados</a>
                <form th:action="@{/produtos/{id}/apagar(id=${produto.id})}" method="post"
                      onsubmit="return confirm('Apagar o produto e todas as imagens do bucket?')">
                    <button type="submit" class="botao perigo">Apagar produto</button>
                </form>
            </div>
        </div>
    </section>

    <section>
        <h2 th:text="'Galeria (' + ${#lists.size(produto.imagens)} + ')'">Galeria</h2>
        <p class="vazio" th:if="${#lists.isEmpty(produto.imagens)}">Este produto ainda não tem imagens.</p>

        <div class="galeria">
            <figure th:each="imagem : ${produto.imagens}" th:classappend="${imagem.principal} ? 'principal'">
                <img th:src="${imagem.urlPublica}" th:alt="${imagem.nomeArquivoOriginal}"
                     th:attr="data-destaque=${imagem.urlPublica}" loading="lazy">
                <figcaption>
                    <span class="selo" th:if="${imagem.principal}">Principal</span>
                    <span class="meta" th:text="${#temporals.format(imagem.dataUpload, 'dd/MM/yyyy HH:mm')}"></span>
                    <div class="acoes-imagem">
                        <form th:unless="${imagem.principal}" th:action="@{/imagens/{id}/principal(id=${imagem.id})}" method="post">
                            <button type="submit" class="link">Tornar principal</button>
                        </form>
                        <a th:href="@{/imagens/{id}/download(id=${imagem.id})}" class="link">Baixar</a>
                        <a th:href="${imagem.urlPublica}" target="_blank" rel="noopener" class="link">URL pública</a>
                        <form th:action="@{/imagens/{id}/apagar(id=${imagem.id})}" method="post"
                              onsubmit="return confirm('Apagar esta imagem do bucket?')">
                            <input type="hidden" name="produtoId" th:value="${produto.id}">
                            <button type="submit" class="link perigo">Apagar</button>
                        </form>
                    </div>
                </figcaption>
            </figure>
        </div>
    </section>

    <section class="painel">
        <h2>Enviar novas imagens</h2>
        <form th:action="@{/produtos/{id}/imagens(id=${produto.id})}" method="post" enctype="multipart/form-data">
            <div th:replace="~{fragmentos/layout :: upload('adicionar')}"></div>
            <button type="submit" class="botao">Enviar para o bucket</button>
        </form>
    </section>
</main>
<script th:src="@{/js/upload.js}"></script>
<script>
    document.querySelectorAll('[data-destaque]').forEach(function (miniatura) {
        miniatura.addEventListener('click', function () {
            var destaque = document.getElementById('imagem-destaque');
            if (destaque) destaque.src = miniatura.dataset.destaque;
        });
    });
</script>
</body>
</html>
