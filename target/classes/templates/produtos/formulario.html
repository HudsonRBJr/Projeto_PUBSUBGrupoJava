<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${produtoId == null ? 'Novo produto' : 'Editar produto'})}"></head>
<body>
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>

<main class="container estreito">
    <div class="titulo-pagina">
        <h1 th:text="${produtoId == null ? 'Novo produto' : 'Editar produto'}">Novo produto</h1>
    </div>

    <form class="formulario" method="post" enctype="multipart/form-data"
          th:action="${produtoId == null} ? @{/produtos} : @{/produtos/{id}(id=${produtoId})}"
          th:object="${produtoForm}">

        <label>Nome
            <input type="text" th:field="*{nome}" maxlength="120" required>
            <span class="campo-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </label>

        <label>Descrição
            <textarea th:field="*{descricao}" rows="4" maxlength="2000"></textarea>
            <span class="campo-erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
        </label>

        <label>Preço (R$)
            <input type="number" th:field="*{preco}" step="0.01" min="0" required>
            <span class="campo-erro" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></span>
        </label>

        <fieldset th:if="${produtoId == null}">
            <legend>Imagens</legend>
            <div th:replace="~{fragmentos/layout :: upload('novo')}"></div>
        </fieldset>

        <div class="acoes">
            <button type="submit" class="botao">Salvar</button>
            <a th:href="${produtoId == null} ? @{/produtos} : @{/produtos/{id}(id=${produtoId})}" class="botao secundario">Cancelar</a>
        </div>
    </form>
</main>
<script th:src="@{/js/upload.js}"></script>
</body>
</html>
