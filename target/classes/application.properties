spring.application.name=ecommerce
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.bucket.nome=${GCP_BUCKET:fatec-2026-grupo-h}
# true somente se o bucket usar ACL por objeto (sem "uniform bucket-level access")
app.bucket.acl-publica=false
app.gcp.credenciais=${GOOGLE_APPLICATION_CREDENTIALS:}
app.seed.ativo=false
