
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Loja Grupo H'">Loja Grupo H</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

<header th:fragment="cabecalho" class="cabecalho">
    <div class="container cabecalho-conteudo">
        <a th:href="@{/produtos}" class="marca">Loja Grupo H</a>

        <nav>
            <a th:href="@{/produtos}">Catálogo</a>
            <a th:href="@{/produtos/novo}">Novo produto</a>
            <a th:href="@{/bucket}">Bucket</a>
        </nav>
    </div>
</header>

<div th:fragment="mensagens">
    <div class="alerta sucesso"
         th:if="${sucesso}"
         th:text="${sucesso}">
    </div>

    <div class="alerta erro"
         th:if="${erro}"
         th:text="${erro}">
    </div>
</div>

<div th:fragment="upload(modo)"
     class="upload"
     th:attr="data-upload=${modo}">

    <input type="file"
           name="arquivos"
           accept="image/*"
           multiple>

    <p class="dica">
        Selecione uma ou mais imagens e marque qual será
        a principal (capa).
    </p>

    <div class="previa"></div>
</div>

</body>
</html>
